
name: Frontend CI

on:
  push:
    branches:
      - learning/first-ci-pipeline
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build React frontend
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
