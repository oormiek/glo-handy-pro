
# Production application
spring.application.name=glo-handy-pro
server.port=${PORT:8082}

# Hosted PostgreSQL - provide the full JDBC URL via environment variable
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database schema management
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Admin credentials - supplied by the hosting environment
spring.security.user.name=${ADMIN_USERNAME}
spring.security.user.password=${ADMIN_PASSWORD}

# Resend email API
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}
glo.business-email=${BUSINESS_EMAIL}

# Avoid verbose security logs in production
logging.level.org.springframework.security=WARN
